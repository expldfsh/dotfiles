<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="rgba" mode="assign"><const>rgb</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    </match>

    <!-- Match explicitly requested generic families before distro substitution. -->
    <match target="pattern">
        <test name="family" qual="first" compare="eq"><string>sans-serif</string></test>
        <edit name="genericfamily" mode="delete_all"/>
        <edit name="family" mode="assign" binding="strong">
            <string>FiraCode Nerd Font</string>
            <string>Noto Sans CJK SC</string>
            <string>Noto Color Emoji</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="first" compare="eq"><string>serif</string></test>
        <edit name="genericfamily" mode="delete_all"/>
        <edit name="family" mode="assign" binding="strong">
            <string>FiraCode Nerd Font</string>
            <string>Noto Sans CJK SC</string>
            <string>Noto Color Emoji</string>
        </edit>
    </match>

    <match target="pattern">
        <test name="family" qual="first" compare="eq"><string>monospace</string></test>
        <edit name="genericfamily" mode="delete_all"/>
        <edit name="family" mode="assign" binding="strong">
            <string>FiraCode Nerd Font Mono</string>
            <string>Noto Sans CJK SC</string>
            <string>Noto Color Emoji</string>
        </edit>
    </match>

    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Noto Sans CJK SC</family>
            <family>Adwaita Sans</family>
            <family>Liberation Sans</family>
        </prefer>
    </alias>

    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Noto Sans CJK SC</family>
            <family>Adwaita Sans</family>
            <family>Liberation Sans</family>
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>JetBrains Mono</family>
            <family>Adwaita Mono</family>
        </prefer>
    </alias>

</fontconfig>
