font_family FiraCode Nerd Font
shell /usr/bin/fish
cursor_shape block
shell_integration no-cursor
term xterm-256color
background_opacity 1
remember_window_size no
initial_window_width 110c
initial_window_height 35c

# cursor animation
cursor_trail 1

font_size 14

# BEGIN_KITTY_THEME
# Matugen
include current-theme.conf
# END_KITTY_THEME
